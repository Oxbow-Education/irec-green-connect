name: Production Deployment

on:
  push:
    branches:
      - main

jobs:
  Fast-FTP-Action:
    name: Fast FTP Action
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - name: Fast FTP Action
        uses: anvil-solutions/Fast-FTP-Action@2.1.3
        with:
          server: gvam1064.siteground.biz
          port: 21
          username: nina_home@greenworkforceconnect.org
          password: ${{ secrets.FTP_PASSWORD }}
          local_dir: wp-content/plugins/irec-green-connect
          remote_dir: public_html/wp-content/plugins/irec-green-connect
